name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: dotnet publish OfficeVbaSigner/OfficeVbaSigner.csproj -c Release -r win-x86 --self-contained -o publish

      - name: Copy OfficeSIP native DLLs
        run: |
          Copy-Item x86/msosip.dll publish/
          Copy-Item x86/msosipx.dll publish/
          Copy-Item x86/vbe7.dll publish/
          Copy-Item OfficeVbaSigner/Register-SIP.cmd publish/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OfficeVbaSigner-win-x86
          path: publish/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: OfficeVbaSigner-win-x86
          path: publish/

      - name: Create release zip
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path publish/* -DestinationPath "artifact-sign-office-macro-x86-$tag.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifact-sign-office-macro-x86-${{ github.ref_name }}.zip
